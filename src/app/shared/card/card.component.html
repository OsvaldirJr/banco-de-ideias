<div class="card" [routerLink]="['/ideia', this.ideia().id]">
    <div class="card-content">
        @if (ideia().categoria) {
            <span class="card-categoria">{{ideia().categoria}}</span>
        }
        <h3 class="card-title">{{ideia().ideia}}</h3>
        <p class="card-description">
            {{ideia().resolve}}
        </p>

        <div class="card-footer">
            <button class="card-button" >Saiba mais</button>
        </div>
    </div>
</div>
